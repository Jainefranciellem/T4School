<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Título -->
  <title>Agenda</title>

  <!-- ==================== ÍCONES IOS (PRIORIDADE MÁXIMA) ==================== -->
  <!-- iOS usa estes ícones ANTES do manifest.json -->
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icon-180.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/icon-180.png">

  <!-- ==================== META TAGS IOS ==================== -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agenda">

  <!-- ==================== PWA MANIFEST ==================== -->
  <link rel="manifest" href="/manifest.json">

  <!-- ==================== THEME COLOR ==================== -->
  <meta name="theme-color" content="#ff6b00">
  <meta name="msapplication-TileColor" content="#ff6b00">

  <!-- ==================== FAVICONS PADRÃO ==================== -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="shortcut icon" href="/icon-180.png">

  <!-- ==================== META TAGS GERAIS ==================== -->
  <meta name="description" content="Sistema de agenda escolar T4School">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Prevenir zoom no iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body>
  <h1>Agenda T4School</h1>

  <!-- Seu conteúdo aqui -->

  <script>
    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {
          console.log('Service Worker não encontrado (normal se não existir)');
        });
      });
    }
  </script>
</body>

</html>
