name: Lembretes de aula

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Chama o job de lembretes do backend
        run: |
          curl -sf -X POST "${{ secrets.REMINDERS_API_URL }}/internal/jobs/reminders" \
            -H "X-Internal-Secret: ${{ secrets.REMINDERS_INTERNAL_SECRET }}"
